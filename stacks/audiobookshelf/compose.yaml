services:
  audiobookshelf-init:
    image: busybox
    command: chown -R 1000:1000 /config /metadata /audiobooks /podcasts
    volumes:
      - ${APPDATA_ROOT}/audiobookshelf/config:/config
      - ${APPDATA_ROOT}/audiobookshelf/metadata:/metadata
      - ${MEDIA_ROOT}/library/audiobooks:/audiobooks
      - ${MEDIA_ROOT}/library/podcasts:/podcasts
    user: root
    networks:
      - traefik

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA_ROOT}/audiobookshelf/config:/config
      - ${APPDATA_ROOT}/audiobookshelf/metadata:/metadata
      - ${MEDIA_ROOT}/library/audiobooks:/audiobooks
      - ${MEDIA_ROOT}/library/podcasts:/podcasts
    depends_on:
      audiobookshelf-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.${BASE_DOMAIN}`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=web"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
      - "traefik.http.middlewares.audiobookshelf-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.audiobookshelf.middlewares=audiobookshelf-headers"
      - "diun.enable=true"
      - "homepage.group=Media"
      - "homepage.name=Audiobookshelf"
      - "homepage.icon=audiobookshelf"
      - "homepage.href=https://audiobookshelf.${BASE_DOMAIN}"
      - "homepage.description=Audiobook & podcast server"
    networks:
      - traefik

networks:
  traefik:
    external: true
