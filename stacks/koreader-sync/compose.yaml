services:
  kosync:
    build:
      context: https://github.com/koreader/koreader-sync-server.git
    container_name: kosync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ}
      - ENABLE_USER_REGISTRATION=${KOSYNC_ENABLE_USER_REGISTRATION:-true}
      - GIN_ENV=production
    expose:
      - 17200
    volumes:
      # Upstream's run script never applies `daemon off;`, so runit restarts
      # nginx every two seconds and floods logs/error.log - see service-run.sh
      - ./service-run.sh:/etc/service/koreader-sync-server/run:ro
      - ${APPDATA_ROOT}/kosync/logs/app:/app/koreader-sync-server/logs
      - ${APPDATA_ROOT}/kosync/logs/redis:/var/log/redis
      - ${APPDATA_ROOT}/kosync/redis:/var/lib/redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.kosync.rule=Host(`kosync.${BASE_DOMAIN}`)
      - traefik.http.routers.kosync.entrypoints=web
      - traefik.http.services.kosync.loadbalancer.server.port=17200
      - "homepage.group=System"
      - "homepage.name=KOSync"
      - "homepage.icon=koreader"
      - "homepage.href=https://kosync.${BASE_DOMAIN}"
      - "homepage.description=KOReader sync server"
    networks:
      - traefik

networks:
  traefik:
    external: true
