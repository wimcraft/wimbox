services:
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ}
    volumes:
      - ${MEDIA_ROOT}/library/manga:/manga
      - ${MEDIA_ROOT}/library/comics:/comics
      - ${MEDIA_ROOT}/library/ebooks:/books
      - ${APPDATA_ROOT}/kavita/config:/kavita/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kavita.rule=Host(`kavita.${BASE_DOMAIN}`)"
      - "traefik.http.routers.kavita.entrypoints=web"
      - "traefik.http.services.kavita.loadbalancer.server.port=5000"
      - "diun.enable=true"
      - "homepage.group=Media"
      - "homepage.name=Kavita"
      - "homepage.icon=kavita"
      - "homepage.href=https://kavita.${BASE_DOMAIN}"
      - "homepage.description=Manga &amp; books"
    networks:
      - traefik

networks:
  traefik:
    external: true
