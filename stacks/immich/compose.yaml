services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=immich-database
      - DB_USERNAME=${IMMICH_DB_USERNAME:-immich}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:-immich}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME:-immich}
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - ${MEDIA_ROOT}/immich/library:/usr/src/app/upload
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.${BASE_DOMAIN}`)"
      - "traefik.http.routers.immich.entrypoints=web"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "diun.enable=true"
      - "homepage.group=Media"
      - "homepage.name=Immich"
      - "homepage.icon=immich"
      - "homepage.href=https://immich.${BASE_DOMAIN}"
      - "homepage.description=Photo &amp; video backup"
    depends_on:
      - immich-redis
      - immich-database
    networks:
      - traefik

  # Serves only the links shared from Immich, on the same hostname as Immich itself:
  # /share/<key> and /s/<slug> go here, everything else (UI, API) goes to immich-server.
  # Shared images are served as raw files (/share/photo/<key>/<asset>/original), so the URL can be embedded.
  immich-public-proxy:
    image: alangrainger/immich-public-proxy:latest
    container_name: immich_public_proxy
    restart: unless-stopped
    environment:
      - IMMICH_URL=http://immich-server:2283
      - PUBLIC_BASE_URL=https://immich.${BASE_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich-share.rule=Host(`immich.${BASE_DOMAIN}`) && (PathPrefix(`/share/`) || PathPrefix(`/s/`))"
      - "traefik.http.routers.immich-share.entrypoints=web"
      - "traefik.http.routers.immich-share.priority=100"
      - "traefik.http.services.immich-share.loadbalancer.server.port=3000"
      - "diun.enable=true"
    depends_on:
      - immich-server
    networks:
      - traefik

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ}
      - MACHINE_LEARNING_MODEL_REVISION=v2
    volumes:
      - ${APPDATA_ROOT}/immich/model-cache:/cache
    labels:
      - "diun.enable=true"
    networks:
      - traefik

  immich-redis:
    image: redis:7-alpine
    container_name: immich_redis
    restart: unless-stopped
    labels:
      - "diun.enable=true"
    networks:
      - traefik

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${IMMICH_DB_USERNAME:-immich}
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD:-immich}
      - POSTGRES_DB=${IMMICH_DB_DATABASE_NAME:-immich}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${APPDATA_ROOT}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    labels:
      - "diun.enable=true"
    networks:
      - traefik

networks:
  traefik:
    external: true
