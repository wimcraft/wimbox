services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    network_mode: host
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${APPDATA_ROOT}/syncthing:/config
      - ${MEDIA_ROOT}/syncthing:/data
      # Obsidian vault (synced by the obsidian stack); share only the Drafting bits, see README
      - ${MEDIA_ROOT}/obsidian:/obsidian
    labels:
      - "diun.enable=true"
      - "homepage.group=Files"
      - "homepage.name=Syncthing"
      - "homepage.icon=syncthing"
      - "homepage.description=File synchronization"

